name: Build and test ps5-mcp
description: >-
  Install LLVM 18 and the pinned ps5-payload-dev SDK, build the PS5 payload
  (build/ps5-mcp.elf), then build the host mock server and run the end-to-end
  MCP test suite against it (ASan + UBSan).

inputs:
  sdk-version:
    description: ps5-payload-dev/sdk release tag to build against.
    required: false
    default: v0.45

runs:
  using: composite
  steps:
    - name: Install LLVM 18 toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-18 lld-18 llvm-18 wget unzip

    - name: Download pinned PS5 Payload SDK (${{ inputs.sdk-version }})
      shell: bash
      run: |
        url="https://github.com/ps5-payload-dev/sdk/releases/download/${{ inputs.sdk-version }}/ps5-payload-sdk.zip"
        echo "Fetching $url"
        wget -q "$url" -O "${RUNNER_TEMP}/ps5-payload-sdk.zip"
        mkdir -p "${RUNNER_TEMP}/ps5-sdk"
        unzip -q "${RUNNER_TEMP}/ps5-payload-sdk.zip" -d "${RUNNER_TEMP}/ps5-sdk"
        sdk_mk="$(find "${RUNNER_TEMP}/ps5-sdk" -type f -path '*/toolchain/prospero.mk' | head -n1)"
        if [ -z "$sdk_mk" ]; then
          echo "::error::prospero.mk not found in the SDK archive" >&2
          exit 1
        fi
        sdk="$(dirname "$(dirname "$sdk_mk")")"
        echo "PS5_PAYLOAD_SDK=$sdk"
        # Later steps (and semantic-release's prepare step) build with it too.
        echo "PS5_PAYLOAD_SDK=$sdk" >> "$GITHUB_ENV"
        echo "LLVM_CONFIG=/usr/bin/llvm-config-18" >> "$GITHUB_ENV"

    - name: Build PS5 payload
      shell: bash
      run: |
        set -euo pipefail
        make all
        test -f build/ps5-mcp.elf
        echo "Built artifact:"
        ls -l build/ps5-mcp.elf

    - name: Run end-to-end tests (host mock build)
      shell: bash
      run: |
        # ASan cannot map its shadow memory with the high mmap randomisation
        # of recent runner kernels.
        sudo sysctl -w vm.mmap_rnd_bits=28
        make test
